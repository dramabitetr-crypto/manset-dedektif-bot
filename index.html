<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manşet Arkası Dedektiflik</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            margin-top: 10px;
        }
        h2 { color: #f59e0b; text-align: center; margin-top: 0; }
        .case-box {
            background: #0f172a;
            padding: 15px;
            border-left: 4px solid #f59e0b;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.5;
        }
        .suspects {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        button {
            background: #334155;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }
        button:hover { background: #475569; }
        button.correct { background: #16a34a !important; }
        button.wrong { background: #dc2626 !important; }
        #result-message {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
        }
        .action-btn {
            margin-top: 15px;
            background: #f59e0b;
            color: #0f172a;
            font-weight: bold;
            justify-content: center;
            display: none;
        }
        .action-btn:hover { background: #d97706; }
    </style>
</head>
<body>

    <div class="container">
        <h2 id="case-title">🕵️ Yükleniyor...</h2>
        <div class="case-box" id="case-text">Vakalar yükleniyor, lütfen bekleyin...</div>

        <div class="suspects" id="suspects-list"></div>

        <div id="result-message"></div>
        
        <button id="next-btn" class="action-btn" onclick="nextCase()">➡️ Sonraki Vakaya Geç</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let cases = [];
        let currentCaseIndex = 0;

        // JSON dosyasından vakaları dışarıdan çek
        fetch('vakalar.json')
            .then(response => response.json())
            .then(data => {
                cases = data;
                loadCase();
            })
            .catch(error => {
                console.error('Vakalar yüklenirken hata oluştu:', error);
                document.getElementById('case-text').innerText = "Vakalar yüklenirken bir hata oluştu!";
            });

        function loadCase() {
            if (cases.length === 0) return;
            let current = cases[currentCaseIndex];
            document.getElementById('case-title').innerHTML = current.title;
            document.getElementById('case-text').innerHTML = current.content;

            let suspectsList = document.getElementById('suspects-list');
            suspectsList.innerHTML = "";

            current.suspects.forEach(suspect => {
                let btn = document.createElement('button');
                btn.innerHTML = suspect.text;
                btn.onclick = function() { checkAnswer(suspect.correct, btn); };
                suspectsList.appendChild(btn);
            });

            document.getElementById('result-message').innerHTML = "";
            document.getElementById('next-btn').style.display = "none";
        }

        function checkAnswer(isCorrect, btnElement) {
            let buttons = document.querySelectorAll('.suspects button');
            buttons.forEach(b => b.disabled = true);

            let resultDiv = document.getElementById('result-message');
            let nextBtn = document.getElementById('next-btn');

            if (isCorrect) {
                btnElement.classList.add('correct');
                resultDiv.innerHTML = "🎉 TEBRİKLER DETEKTİF! Olayı çözdün.";
                resultDiv.style.color = "#4ade80";
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            } else {
                btnElement.classList.add('wrong');
                resultDiv.innerHTML = "❌ YANLIŞ TAHMİN! Katil bu değil.";
                resultDiv.style.color = "#f87171";
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
            }

            nextBtn.style.display = "block";
        }

        function nextCase() {
            currentCaseIndex++;
            if (currentCaseIndex < cases.length) {
                loadCase();
            } else {
                // Tüm vakalar bitince başa dön
                currentCaseIndex = 0;
                loadCase();
            }
        }
    </script>
</body>
</html>
