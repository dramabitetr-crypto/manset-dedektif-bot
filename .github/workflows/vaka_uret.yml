name: Dedektif Botunu Çalıştır

on:
  workflow_dispatch: # Sadece senin "Run workflow" butonuna basmanla çalışır

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları İndir
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: FFmpeg, FFprobe ve Türkçe Font Kurulumu
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu

      - name: Kütüphaneleri Yükle
        run: |
          pip install requests pillow gtts

      - name: Python Scriptini Çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python generator.py

      - name: Değişiklikleri Depoya Kaydet (Index İlerlemesi İçin)
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "bot@github.com"
          git add state.json
          git commit -m "Otomatik vaka indexi güncellendi [skip ci]"
          git push
