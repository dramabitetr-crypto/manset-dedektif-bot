name: Vaka Videosu Üret

on:
  workflow_dispatch:
    inputs:
      vaka_no:
        description: "Vaka numarası (boş bırakırsan sıradaki vaka üretilir)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları İndir
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: FFmpeg ve Font Kurulumu
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu

      - name: Kütüphaneleri Yükle
        run: |
          pip install requests pillow numpy edge-tts

      - name: Videoyu Üret
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VAKA_NO: ${{ inputs.vaka_no }}
        run: |
          python generator.py

      - name: Sıradaki Vaka Numarasını Kaydet
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "bot@github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Vaka sırası güncellendi [skip ci]" && git push)
