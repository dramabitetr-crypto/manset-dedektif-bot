name: Dedektif Botunu Çalıştır

on:
  workflow_dispatch: # İste! Bu satır sayesinde GitHub'da "Run workflow" butonu belirecek!

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları İndir
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yükle
        run: |
          pip install python-telegram-bot

      - name: Botu Çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          python bot.py
